spring.application.name=MGserver
server.port=8081

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/mgserver?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:yln27878}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.http.converters.preferred-json-mapper=jackson2

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

mg.algorithm.python=${PYTHON_CMD:python}
mg.algorithm.dir=${MG_ALGORITHM_DIR:}
mg.algorithm.bee=${MOIABC_BEE:60}
mg.algorithm.max-iter=${MOIABC_MAX_ITER:300}
mg.algorithm.archive-size=${MOIABC_ARCHIVE_SIZE:80}
